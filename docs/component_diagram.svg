<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="100%" height="100%" style="background:#090d16; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>

  <!-- Header -->
  <text x="600" y="45" text-anchor="middle" fill="#f9fafb" font-size="24" font-weight="700">DROP-OFF OASIS FILE COMPONENT DIAGRAM</text>
  <text x="600" y="70" text-anchor="middle" fill="#9ca3af" font-size="14">Detailed Modular Blueprint & Data Flow Per Codebase File</text>

  <!-- Component 1: app/agent.py -->
  <g filter="url(#shadow)">
    <rect x="50" y="110" width="340" height="540" rx="14" fill="url(#cardBg)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="50" y="110" width="340" height="45" rx="14" fill="#059669"/>
    <text x="220" y="138" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">📄 app/agent.py (Core Agent)</text>

    <!-- Functions in agent.py -->
    <rect x="70" y="175" width="300" height="60" rx="8" fill="#111827" stroke="#374151"/>
    <text x="220" y="198" text-anchor="middle" fill="#34d399" font-size="12" font-weight="600">get_nearby_scenic_walks()</text>
    <text x="220" y="218" text-anchor="middle" fill="#9ca3af" font-size="10">10+ Nature Spots + RAG Memory Filter (_SEEN_SPOTS)</text>

    <rect x="70" y="248" width="300" height="60" rx="8" fill="#111827" stroke="#374151"/>
    <text x="220" y="271" text-anchor="middle" fill="#34d399" font-size="12" font-weight="600">generate_walk_soundtrack()</text>
    <text x="220" y="291" text-anchor="middle" fill="#9ca3af" font-size="10">Dynamic 30s Audio Synthesis (Cloud TTS + Music + GCS)</text>

    <rect x="70" y="321" width="300" height="60" rx="8" fill="#111827" stroke="#374151"/>
    <text x="220" y="344" text-anchor="middle" fill="#34d399" font-size="12" font-weight="600">calculate_time_budget()</text>
    <text x="220" y="364" text-anchor="middle" fill="#9ca3af" font-size="10">Zero-Stress Schedule (Return 5 mins before pickup)</text>

    <rect x="70" y="394" width="300" height="60" rx="8" fill="#111827" stroke="#374151"/>
    <text x="220" y="417" text-anchor="middle" fill="#34d399" font-size="12" font-weight="600">submit_place_review()</text>
    <text x="220" y="437" text-anchor="middle" fill="#9ca3af" font-size="10">Community Star Rating & Photo Description Log</text>

    <rect x="70" y="467" width="300" height="60" rx="8" fill="#111827" stroke="#374151"/>
    <text x="220" y="490" text-anchor="middle" fill="#34d399" font-size="12" font-weight="600">get_weather()</text>
    <text x="220" y="510" text-anchor="middle" fill="#9ca3af" font-size="10">Real-time Weather & Precipitation Risk</text>

    <rect x="70" y="540" width="300" height="90" rx="8" fill="#064e3b" stroke="#059669"/>
    <text x="220" y="563" text-anchor="middle" fill="#a7f3d0" font-size="13" font-weight="700">root_agent = Agent(...)</text>
    <text x="220" y="583" text-anchor="middle" fill="#ffffff" font-size="11">Model: Gemini 3.6 Flash</text>
    <text x="220" y="603" text-anchor="middle" fill="#ffffff" font-size="11">Callback: a2ui_callback</text>
  </g>

  <!-- Component 2: frontend/main.py -->
  <g filter="url(#shadow)">
    <rect x="430" y="110" width="340" height="540" rx="14" fill="url(#cardBg)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="430" y="110" width="340" height="45" rx="14" fill="#2563eb"/>
    <text x="600" y="138" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">🖥️ frontend/main.py (FastAPI A2A Proxy)</text>

    <rect x="450" y="180" width="300" height="75" rx="8" fill="#111827" stroke="#374151"/>
    <text x="600" y="205" text-anchor="middle" fill="#60a5fa" font-size="13" font-weight="600">@app.post("/chat")</text>
    <text x="600" y="225" text-anchor="middle" fill="#9ca3af" font-size="11">Receives browser chat messages</text>
    <text x="600" y="242" text-anchor="middle" fill="#9ca3af" font-size="10">Streams responses & A2UI cards back to UI</text>

    <rect x="450" y="275" width="300" height="75" rx="8" fill="#111827" stroke="#374151"/>
    <text x="600" y="300" text-anchor="middle" fill="#60a5fa" font-size="13" font-weight="600">fetch_agent_card()</text>
    <text x="600" y="320" text-anchor="middle" fill="#9ca3af" font-size="11">Fetches agent-card.json from Agent Engine</text>
    <text x="600" y="337" text-anchor="middle" fill="#9ca3af" font-size="10">Rewrites internal 0.0.0.0 URLs to A2A_BASE</text>

    <rect x="450" y="370" width="300" height="75" rx="8" fill="#111827" stroke="#374151"/>
    <text x="600" y="395" text-anchor="middle" fill="#60a5fa" font-size="13" font-weight="600">A2A Client Connection</text>
    <text x="600" y="415" text-anchor="middle" fill="#9ca3af" font-size="11">google.protobuf.json_format.ParseDict</text>
    <text x="600" y="432" text-anchor="middle" fill="#9ca3af" font-size="10">Handles StreamResponse events & tasks</text>

    <rect x="450" y="465" width="300" height="75" rx="8" fill="#111827" stroke="#374151"/>
    <text x="600" y="490" text-anchor="middle" fill="#60a5fa" font-size="13" font-weight="600">Static File Server</text>
    <text x="600" y="510" text-anchor="middle" fill="#9ca3af" font-size="11">Mounts frontend/static/index.html</text>
    <text x="600" y="527" text-anchor="middle" fill="#9ca3af" font-size="10">Serves web UI on Port 8085</text>
  </g>

  <!-- Component 3: frontend/static/index.html -->
  <g filter="url(#shadow)">
    <rect x="810" y="110" width="340" height="540" rx="14" fill="url(#cardBg)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="810" y="110" width="340" height="45" rx="14" fill="#d97706"/>
    <text x="980" y="138" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">🎨 frontend/static/index.html (UI)</text>

    <rect x="830" y="180" width="300" height="75" rx="8" fill="#111827" stroke="#374151"/>
    <text x="980" y="205" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="600">formatTextNode(text)</text>
    <text x="980" y="225" text-anchor="middle" fill="#9ca3af" font-size="11">Parses markdown images ![alt](url)</text>
    <text x="980" y="242" text-anchor="middle" fill="#9ca3af" font-size="10">Renders high-res visual image cards in chat</text>

    <rect x="830" y="275" width="300" height="75" rx="8" fill="#111827" stroke="#374151"/>
    <text x="980" y="300" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="600">HTML5 Audio Player</text>
    <text x="980" y="320" text-anchor="middle" fill="#9ca3af" font-size="11">Detects .mp3 GCS audio streams</text>
    <text x="980" y="337" text-anchor="middle" fill="#9ca3af" font-size="10">Embeds interactive &lt;audio controls&gt;</text>

    <rect x="830" y="370" width="300" height="75" rx="8" fill="#111827" stroke="#374151"/>
    <text x="980" y="395" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="600">renderSurface() A2UI Renderer</text>
    <text x="980" y="415" text-anchor="middle" fill="#9ca3af" font-size="11">Renders native Cards, Columns, Lists</text>
    <text x="980" y="432" text-anchor="middle" fill="#9ca3af" font-size="10">Builds interactive UI widgets</text>

    <rect x="830" y="465" width="300" height="75" rx="8" fill="#111827" stroke="#374151"/>
    <text x="980" y="490" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="600">Quick Prompt Chips</text>
    <text x="980" y="510" text-anchor="middle" fill="#9ca3af" font-size="11">1-Click presets for walk, audio, schedule</text>
    <text x="980" y="527" text-anchor="middle" fill="#9ca3af" font-size="10">Instant parent user interaction</text>
  </g>

  <!-- Footer -->
  <text x="600" y="690" text-anchor="middle" fill="#4b5563" font-size="12">Drop-Off Oasis Architecture Blueprint • Created for Google ADK Agent Project</text>
</svg>
