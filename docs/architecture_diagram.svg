<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0f172a; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#4caf50"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#bgGrad)"/>
  
  <!-- Grid Lines -->
  <g stroke="#334155" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.3">
    <line x1="100" y1="0" x2="100" y2="680"/>
    <line x1="350" y1="0" x2="350" y2="680"/>
    <line x1="650" y1="0" x2="650" y2="680"/>
    <line x1="950" y1="0" x2="950" y2="680"/>
  </g>

  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="700" letter-spacing="1">DROP-OFF OASIS ARCHITECTURE DIAGRAM</text>
  <text x="600" y="70" text-anchor="middle" fill="#94a3b8" font-size="14">End-to-End ADK Agent, A2A Protocol, Audio Engine & Vertex AI Cloud Infrastructure</text>

  <!-- Node 1: Browser Client -->
  <g filter="url(#shadow)">
    <rect x="50" y="140" width="240" height="460" rx="16" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="50" y="140" width="240" height="50" rx="16" fill="url(#accentGrad)"/>
    <text x="170" y="172" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Web Client UI</text>
    <text x="170" y="215" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="600">HTML5 + Native A2UI Renderer</text>

    <!-- Sub components -->
    <rect x="70" y="240" width="200" height="55" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="170" y="263" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">💬 Chat Bubble Component</text>
    <text x="170" y="280" text-anchor="middle" fill="#94a3b8" font-size="10">Markdown Images & Text</text>

    <rect x="70" y="315" width="200" height="55" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="170" y="338" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">🪪 A2UI Card Engine</text>
    <text x="170" y="355" text-anchor="middle" fill="#94a3b8" font-size="10">Dynamic Rich Widgets</text>

    <rect x="70" y="390" width="200" height="55" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="170" y="413" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">🎧 HTML5 Audio Streamer</text>
    <text x="170" y="430" text-anchor="middle" fill="#94a3b8" font-size="10">30s Studio Player</text>

    <rect x="70" y="465" width="200" height="55" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="170" y="488" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">📸 Photo Logger</text>
    <text x="170" y="505" text-anchor="middle" fill="#94a3b8" font-size="10">Pre-Review Image Upload</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 290 320 L 350 320" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" fill="none" filter="url(#glow)"/>
  <text x="320" y="310" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="600">HTTP / JSON</text>

  <!-- Node 2: FastAPI Proxy Server -->
  <g filter="url(#shadow)">
    <rect x="350" y="140" width="240" height="460" rx="16" fill="url(#cardGrad1)" stroke="#4caf50" stroke-width="1.5"/>
    <rect x="350" y="140" width="240" height="50" rx="16" fill="url(#primaryGrad)"/>
    <text x="470" y="172" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">FastAPI A2A Proxy</text>
    <text x="470" y="215" text-anchor="middle" fill="#4caf50" font-size="13" font-weight="600">frontend/main.py (Port 8085)</text>

    <!-- Sub components -->
    <rect x="370" y="250" width="200" height="60" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="470" y="275" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">⚡ /chat Endpoint</text>
    <text x="470" y="295" text-anchor="middle" fill="#94a3b8" font-size="10">Async Event Streaming</text>

    <rect x="370" y="330" width="200" height="60" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="470" y="355" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">🔌 A2A Client Connector</text>
    <text x="470" y="375" text-anchor="middle" fill="#94a3b8" font-size="10">Card Parsing & Protocol</text>

    <rect x="370" y="410" width="200" height="60" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="470" y="435" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">🔁 URL Rewriter</text>
    <text x="470" y="455" text-anchor="middle" fill="#94a3b8" font-size="10">Internal Container -> GCP</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 590 320 L 650 320" stroke="#4caf50" stroke-width="2.5" fill="none" filter="url(#glow)"/>
  <text x="620" y="310" text-anchor="middle" fill="#4caf50" font-size="11" font-weight="600">A2A Stream</text>

  <!-- Node 3: Vertex AI Agent Runtime -->
  <g filter="url(#shadow)">
    <rect x="650" y="140" width="250" height="460" rx="16" fill="url(#cardGrad1)" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="650" y="140" width="250" height="50" rx="16" fill="url(#goldGrad)"/>
    <text x="775" y="172" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Agent Runtime (GCP)</text>
    <text x="775" y="215" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="600">ReasoningEngine 65110439...</text>

    <!-- Tools -->
    <rect x="670" y="240" width="210" height="45" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="775" y="267" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">🌲 get_nearby_scenic_walks</text>

    <rect x="670" y="295" width="210" height="45" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="775" y="322" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">🧠 RAG Memory Filter</text>

    <rect x="670" y="350" width="210" height="45" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="775" y="377" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">🎙️ generate_walk_soundtrack</text>

    <rect x="670" y="405" width="210" height="45" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="775" y="432" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">⏱️ calculate_time_budget</text>

    <rect x="670" y="460" width="210" height="45" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="775" y="487" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">📸 submit_place_review</text>
  </g>

  <!-- Arrow 3 -> Services -->
  <path d="M 900 320 L 960 320" stroke="#fbbf24" stroke-width="2.5" fill="none" filter="url(#glow)"/>

  <!-- Node 4: External Google Cloud Services -->
  <g filter="url(#shadow)">
    <rect x="960" y="140" width="190" height="460" rx="16" fill="url(#cardGrad1)" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="960" y="140" width="190" height="50" rx="16" fill="#9333ea"/>
    <text x="1055" y="172" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Google Cloud APIs</text>
    <text x="1055" y="215" text-anchor="middle" fill="#c084fc" font-size="12" font-weight="600">Cloud Services</text>

    <rect x="975" y="250" width="160" height="55" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="1055" y="275" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">🗣️ Cloud TTS API</text>
    <text x="1055" y="292" text-anchor="middle" fill="#94a3b8" font-size="10">Neural2 Voice Engine</text>

    <rect x="975" y="325" width="160" height="55" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="1055" y="350" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">🪣 Cloud Storage</text>
    <text x="1055" y="367" text-anchor="middle" fill="#94a3b8" font-size="10">Audio Media Bucket</text>

    <rect x="975" y="400" width="160" height="55" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="1055" y="425" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">✨ Gemini 3.6 Flash</text>
    <text x="1055" y="442" text-anchor="middle" fill="#94a3b8" font-size="10">LLM Engine</text>

    <rect x="975" y="475" width="160" height="55" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="1055" y="500" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">🗺️ Static Maps API</text>
    <text x="1055" y="517" text-anchor="middle" fill="#94a3b8" font-size="10">Trail Location Views</text>
  </g>

  <!-- Footer -->
  <text x="600" y="650" text-anchor="middle" fill="#64748b" font-size="12">Drop-Off Oasis • Built with Google Agent Development Kit (ADK) & Vertex AI Agent Engine</text>
</svg>
